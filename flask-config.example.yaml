# Demo values. For real deployments, keep credentials in a Secret, not ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-config
  namespace: faralpha
data:
  MONGO_DB: flask_db
  MONGODB_URI: "mongodb://flaskuser:change-this-app-password@mongodb-0.mongodb.faralpha.svc.cluster.local:27017/flask_db?authSource=admin"
