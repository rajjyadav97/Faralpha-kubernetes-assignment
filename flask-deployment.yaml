apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: faralpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask
          # For Minikube, build this image with: minikube image build -t faralpha-flask:1.0 .
          image: faralpha-flask:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: flask-config
                  key: MONGO_DB
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: flask-config
                  key: MONGODB_URI
          resources:
            requests:
              cpu: "200m"
              memory: "250Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
