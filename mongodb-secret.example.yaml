# DEMO ONLY: Never commit real credentials.
# Set matching values in MONGO_APP_USERNAME, MONGO_APP_PASSWORD, and MONGODB_URI.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-auth
  namespace: faralpha
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: "REPLACE_WITH_ROOT_USERNAME"
  MONGO_ROOT_PASSWORD: "REPLACE_WITH_STRONG_ROOT_PASSWORD"
  MONGO_APP_USERNAME: "REPLACE_WITH_APP_USERNAME"
  MONGO_APP_PASSWORD: "REPLACE_WITH_STRONG_APP_PASSWORD"
  MONGODB_URI: "mongodb://REPLACE_WITH_APP_USERNAME:REPLACE_WITH_STRONG_APP_PASSWORD@mongodb-0.mongodb.faralpha.svc.cluster.local:27017/flask_db?authSource=admin"
